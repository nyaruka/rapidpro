<script type="text/javascript">
  // Drag and drop reordering of the article tree. Rows are flat with a depth, so a drop is just an insertion index
  // plus a depth taken from how far right the pointer is - the parent is then the nearest preceding row one level
  // shallower. Nothing here is authoritative: the whole resulting order is posted and the server re-derives the tree,
  // rejecting cycles and anything nested deeper than the cap.
  (function() {
    const tree = document.querySelector(".article-tree[data-sort-url]");
    if (!tree) {
      return;
    }

    const MAX_DEPTH = {{ max_depth }};
    const INDENT = 16; // pixels of horizontal travel per level, matching the 1rem row indent

    let dragged = null;
    let marker = null;
    let dropIndex = 0;
    let dropDepth = 0;

    const rows = () => Array.from(tree.querySelectorAll(".article-row"));

    // the rows that travel with a drag: the dragged row and the rows below it that are deeper, i.e. its subtree
    const subtree = function(all, row) {
      const from = all.indexOf(row);
      const depth = parseInt(row.dataset.depth);
      const moving = [row];
      for (let i = from + 1; i < all.length && parseInt(all[i].dataset.depth) > depth; i++) {
        moving.push(all[i]);
      }
      return moving;
    };

    tree.addEventListener("dragstart", function(evt) {
      dragged = evt.target.closest(".article-row");
      if (!dragged) {
        return;
      }
      dragged.classList.add("dragging");
      evt.dataTransfer.effectAllowed = "move";
    });

    tree.addEventListener("dragover", function(evt) {
      if (!dragged) {
        return;
      }
      evt.preventDefault();

      const all = rows();
      dropIndex = all.length;
      for (let i = 0; i < all.length; i++) {
        const box = all[i].getBoundingClientRect();
        if (evt.clientY < box.top + box.height / 2) {
          dropIndex = i;
          break;
        }
      }

      // the row we'd land under bounds how deep we can be - at most one level below it. Rows that are moving with us
      // are skipped, since they won't be there once we land, and taking a depth from one of them would let us claim a
      // parent that ends up nowhere near us.
      const moving = subtree(all, dragged);
      let above = null;
      for (let i = dropIndex - 1; i >= 0; i--) {
        if (moving.indexOf(all[i]) < 0) {
          above = all[i];
          break;
        }
      }

      // our own subtree has to fit under the cap too, not just our row - the descendants move by the same delta we do
      const height = moving.reduce(function(max, row) {
        return Math.max(max, parseInt(row.dataset.depth));
      }, 0) - parseInt(dragged.dataset.depth);

      const maxDepth = above ? parseInt(above.dataset.depth) + 1 : 0;
      const wanted = Math.floor((evt.clientX - tree.getBoundingClientRect().left) / INDENT);
      dropDepth = Math.max(0, Math.min(wanted, maxDepth, MAX_DEPTH - 1 - height));

      if (!marker) {
        marker = document.createElement("div");
        marker.className = "drop-marker";
      }
      marker.style.marginLeft = dropDepth + "rem";
      tree.insertBefore(marker, all[dropIndex] || null);
    });

    tree.addEventListener("dragend", function() {
      if (dragged) {
        dragged.classList.remove("dragging");
      }
      if (marker) {
        marker.remove();
      }
      dragged = null;
      marker = null;
    });

    tree.addEventListener("drop", function(evt) {
      evt.preventDefault();
      if (!dragged) {
        return;
      }

      const all = rows();
      const depthDelta = dropDepth - parseInt(dragged.dataset.depth);

      // a subtree moves with its root
      const moving = subtree(all, dragged);
      if (moving.indexOf(all[dropIndex]) >= 0) {
        return; // can't drop a subtree inside itself
      }

      const before = all[dropIndex] || null;
      moving.forEach(function(row) {
        row.dataset.depth = parseInt(row.dataset.depth) + depthDelta;
        row.style.paddingLeft = row.dataset.depth + "rem";
        tree.insertBefore(row, before);
      });

      // the parent of a row is the nearest one above it a level shallower. Depths are clamped to one more than the
      // row before so a gap can never leave us naming an ancestor that isn't there - JSON.stringify drops undefined
      // keys, and the server would reject the whole ordering for a missing parent.
      const order = [];
      const ancestors = [];
      let previous = -1;
      rows().forEach(function(row, index) {
        const depth = Math.min(parseInt(row.dataset.depth), previous + 1);
        row.dataset.depth = depth;
        row.style.paddingLeft = depth + "rem";
        ancestors[depth] = row.dataset.uuid;
        previous = depth;
        order.push({
          uuid: row.dataset.uuid,
          parent: depth > 0 ? ancestors[depth - 1] : null,
          sort_order: index
        });
      });

      fetchAjax(tree.dataset.sortUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(order)
      }).then(function(response) {
        // the server is the authority on what the tree is, so re-render from it either way
        spaGet(window.location.pathname);
      });
    });
  })();
</script>
